<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaPipe Pose Tracker</title>
    <style>
      /* Container to stack the video and canvas exactly on top of each other */
      #container {
        position: relative;
        width: 640px;
        height: 480px;
        margin: 20px auto;
      }
      video, canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      canvas {
        /* Ensure canvas is drawn on top of the video */
        z-index: 10; 
      }
    </style>
  </head>
  <body>
    <div id="container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="output_canvas"></canvas>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yoga Pose Tracker</title>
    <style>
      body { font-family: sans-serif; padding: 20px; }
      
      /* UI Views */
      #tracker-view { display: none; } /* Hidden by default */
      
      /* Tracker Layout: Camera Left, Feedback Right */
      .tracker-container {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      /* Camera/Canvas Overlay Container */
      .camera-wrapper {
        position: relative;
        width: 640px;
        height: 480px;
        background: #000;
      }
      video, canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      canvas { z-index: 10; }

      /* Feedback Sidebar */
      .feedback-panel {
        flex: 1;
        padding: 20px;
        background: #f4f4f4;
        border-radius: 8px;
        min-height: 440px;
      }
      .feedback-text {
        font-size: 18px;
        margin-bottom: 10px;
      }
      .error { color: red; font-weight: bold; }
      .success { color: green; font-weight: bold; }

      /* Human feedback */
      .fb-headline { font-size: 20px; font-weight: 600; line-height: 1.35; margin-bottom: 12px; }
      .fb-good { color: #15803d; }
      .fb-neutral { color: #0369a1; }
      .fb-cue { display: flex; align-items: center; gap: 12px; font-size: 20px; padding: 12px 14px; margin-bottom: 10px;
                background: #fff; border-left: 5px solid #f59e0b; border-radius: 8px; }
      .fb-icon { font-size: 26px; }
      .fb-debug { margin-top: 16px; font-size: 12px; border-collapse: collapse; width: 100%; }
      .fb-debug th, .fb-debug td { border-bottom: 1px solid #ddd; padding: 3px 6px; text-align: left; }

      /* Home buttons */
      .home-card { padding: 12px 16px; background: #eef6ff; border-radius: 8px; max-width: 560px; margin-bottom: 20px; }
      .home-card button { margin: 4px 6px 4px 0; }

      /* Progress view */
      #progress-view { display: none; max-width: 760px; }
      .progress-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
      .progress-controls button.active { background: #0284c7; color: #fff; border-color: #0284c7; }
      #progress-chart { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
      .progress-table { border-collapse: collapse; width: 100%; margin-top: 20px; font-size: 14px; }
      .progress-table th, .progress-table td { border-bottom: 1px solid #e5e7eb; padding: 6px 8px; text-align: center; }
      .progress-table tbody th { text-align: left; font-weight: 500; }
    </style>
  </head>
  <body>
    <!-- VIEW 1: Homepage with Links -->
    <div id="home-view">
      <div class="home-card">
        <b>Personalise your poses</b>
        <p id="profile-status" style="margin:6px 0; font-size:14px; color:#555;"></p>
        <button id="assess-btn">Start flexibility check (about 3 min)</button>
        <button id="progress-btn">View my progress</button>
        <button id="clear-profile-btn" style="display:none;">Reset profile</button>
      </div>
      <h1>Select an Asana</h1>
      <ul>
        <li><a href="#" class="pose-link" data-pose="tadasana">Mountain Pose (Tadasana)</a></li>
        <li><a href="#" class="pose-link" data-pose="vrksasana">Tree Pose (Vrksasana)</a></li>
        <li><a href="#" class="pose-link" data-pose="virabhadrasana_ii">Warrior II (Virabhadrasana II)</a></li>
        <li><a href="#" class="pose-link" data-pose="trikonasana">Triangle Pose (Trikonasana)</a></li>
        <li><a href="#" class="pose-link" data-pose="bhujangasana">Cobra Pose (Bhujangasana)</a></li>
      </ul>
    </div>

    <!-- VIEW 2: Live Tracker -->
    <!-- Replace your current tracker-view in index.html with this -->
    <div id="tracker-view">
      <button id="back-btn">← Back to Menu</button>
      <h2 id="active-pose-name">Loading...</h2>
      
      <div class="tracker-container">
        <!-- Left Column: Image + Camera -->
        <div class="camera-column">
          <div style="margin-bottom: 15px; text-align: center;">
            <h4 id="reference-title" style="margin: 0 0 5px 0; color: #555;">Reference Pose</h4>
            <!-- Reference Image Element -->
            <img id="reference-image" src="" alt="Reference Pose" style="max-height: 200px; border-radius: 8px; object-fit: contain;" />
          </div>

          <div class="camera-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>
          </div>
        </div>
        
        <!-- Right Column: Feedback -->
        <div class="feedback-panel">
          <h3>Live Feedback</h3>
          <label id="angle-toggle" style="display:none; font-size:13px; color:#666; margin-bottom:10px;">
            <input type="checkbox" id="show-angles" /> Show angle details
          </label>
          <div id="feedback-log"></div>
          <div id="assess-controls" style="display:none; margin-top:16px;">
            <button id="assess-primary" style="display:none; padding:8px 16px; font-size:16px;"></button>
            <button id="assess-skip" style="padding:8px 16px; font-size:14px;">Skip this step</button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- VIEW 3: Progress -->
    <div id="progress-view">
      <button id="progress-back">← Back to Menu</button>
      <h2>Your flexibility progress</h2>
      <p id="progress-note" style="color:#555; font-size:14px;"></p>
      <div class="progress-controls">
        <label for="progress-joint">Movement:</label>
        <select id="progress-joint"></select>
        <button id="progress-line" class="active">Line graph</button>
        <button id="progress-bar">Bar chart</button>
        <button id="progress-sample">Preview with sample data</button>
        <button id="progress-clear" style="display:none;">Delete history</button>
      </div>
      <div id="progress-chart"></div>
      <div id="progress-table"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
